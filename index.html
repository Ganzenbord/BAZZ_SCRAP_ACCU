<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BAZZ Accu Registratie</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --mute:#6b7280; --acc:#0b6bcb; --ok:#188038; --bad:#c5221f; --line:#d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1f2327; --ink:#eceff3; --mute:#98a1ad; --line:#363c43; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:12px; max-width:560px; margin:auto; }
  h1 { font-size:18px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--mute); margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=url], textarea { width:100%; padding:12px; font-size:18px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  textarea { font-size:14px; min-height:90px; }
  select { width:100%; padding:12px; font-size:17px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  button { font-size:17px; padding:13px 16px; border:0; border-radius:10px; background:var(--acc); color:#fff; width:100%; margin-top:8px; }
  button.sec { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  button.small { width:auto; padding:6px 10px; font-size:14px; margin:0; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { background:var(--bg); border:1px solid var(--acc); color:var(--acc); border-radius:16px; padding:6px 12px; font-size:15px; width:auto; margin:0; }
  #preview { width:100%; max-height:200px; object-fit:contain; border-radius:8px; margin-top:8px; display:none; background:#000; }
  #status { font-size:14px; color:var(--mute); margin-top:6px; min-height:20px; }
  .warn { color:var(--bad); font-size:14px; margin-top:6px; }
  .ask { background:#fff4d6; color:#5c4300; border-radius:8px; padding:8px; margin-top:8px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; word-break:break-all; }
  .sync-ok { color:var(--ok); } .sync-wait { color:var(--bad); }
  details summary { cursor:pointer; font-weight:600; }
  .hide { display:none; }
</style>
</head>
<body>
<h1>BAZZ accu registratie <span id="count" style="font-size:14px;color:var(--mute)"></span></h1>
<!-- Versie: bij elke wijziging ophogen, zodat op de telefoon te zien is welke versie er draait. -->
<div id="ver" style="font-size:12px;color:var(--mute);margin:-8px 0 10px">versie 1.7 · 07-10-2026 · VDM-knop, meldt nieuwe versie</div>
<button id="upd" type="button" class="hide" style="background:#c5221f;margin:0 0 10px">Er staat een nieuwe versie online — tik om te vernieuwen</button>
<button id="vdmBtn" type="button" class="sec" style="margin:0 0 10px"></button>

<div class="card">
  <input type="file" id="file" accept="image/*" capture="environment" class="hide">
  <button id="snap">📷 Foto van serienummer</button>
  <img id="preview" alt="">
  <div id="status"></div>
  <div id="raw" style="font-size:12px;color:var(--mute);word-break:break-word"></div>

  <label for="serial">Serienummer <span style="font-weight:400">· tip: houd het veld ingedrukt en kies "Tekst scannen" (iPhone) of gebruik Google Lens (Android); tik op de foto om in te zoomen</span></label>
  <input type="text" id="serial" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <div class="chips" id="serialChips"></div>
  <div class="warn" id="dupWarn"></div>

  <label for="ah">Capaciteit (Ah)</label>
  <input type="text" id="ah" inputmode="decimal" autocomplete="off">
  <div class="chips" id="ahChips"></div>

  <label for="kg">Gewicht (kg)</label>
  <input type="text" id="kg" inputmode="decimal" autocomplete="off">
  <div class="ask hide" id="kgAsk">Gewicht voor deze Ah is nog niet bekend. Vul het in; het wordt onthouden voor de volgende keer.</div>

  <div class="row">
    <div><label for="sup">Leverancier</label>
      <select id="sup"><option value="">— kies —</option><option>Rightenergy</option><option>VDM</option></select></div>
    <div><label for="typ">Type</label>
      <select id="typ"><option value="">— kies —</option><option>Saber</option><option>HLM</option><option>VDM</option></select></div>
  </div>

  <button id="save">Opslaan</button>
  <button class="sec" id="reset">Wissen</button>
</div>

<div class="card">
  <details open>
    <summary>Geregistreerd (<span id="n2">0</span>)</summary>
    <table id="tbl"><thead><tr><th>Serienr</th><th>kg</th><th>Ah</th><th></th><th></th></tr></thead><tbody></tbody></table>
    <div class="row">
      <button class="sec" id="csv">Download CSV</button>
      <button class="sec" id="retry">Opnieuw sturen</button>
    </div>
  </details>
</div>

<div class="card">
  <details>
    <summary>Instellingen</summary>
    <label for="hook">Google Sheets webhook-URL (Apps Script)</label>
    <input type="url" id="hook" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="wt">Gewichtstabel (Ah=kg, één per regel)</label>
    <textarea id="wt" placeholder="7=2.5&#10;60=16.2"></textarea>
    <button id="saveSet">Instellingen opslaan</button>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let records = store.get('records', []);      // {id, serial, kg, ah, ts, dup, synced}
let weights = store.get('weights', {});      // "7" -> 2.5
let hook = store.get('hook', '');
let pendingDel = store.get('pendingDel', []);
let worker = null;
let vdmMode = store.get('vdmMode', false);   // VDM-modus: elke registratie krijgt Type VDM

const normSerial = s => String(s).toUpperCase().replace(/\s+/g, '');
/* LN-accu's: gegraveerd "LN-36V22.4AH-G29-EE-WW-0731102" = sticker "LNA22G29EEWW0731102".
   Alles wordt naar de stickervorm omgezet, zodat gravering en sticker hetzelfde serienummer geven.
   In het lettergedeelte wordt een 0 als Q gelezen (sticker "ER0R" = gravering "ER-QR"). */
const toLetters = t => t.replace(/0/g, 'Q');
function canonSerial(raw) {
  const s = String(raw).toUpperCase().replace(/\s+/g, '').replace(/[–—_]/g, '-');
  let m = s.match(/^LN-?\d+V\d+(?:[.,]\d+)?AH-?[G0]29-?([A-Z0-9]{2})-?([A-Z0-9]{2})-?([0-9O]{6,8})$/);
  if (m) return 'LNA22G29' + toLetters(m[1] + m[2]) + m[3].replace(/O/g, '0');
  m = s.match(/^(?:LN|N)?A22[G0]29-?([A-Z0-9]{4})-?([0-9O]{6,8})$/);          // sticker; de L is soms afgescheurd, G wordt wel eens 0 gelezen
  if (m) return 'LNA22G29' + toLetters(m[1]) + m[2].replace(/O/g, '0');
  m = s.match(/^HLM-?XNW36[V1I]?(\d{2})AH(\d{8})(\d{3})$/);                     // HLM: herstel een weggevallen/verlezen "V" (36v21ah -> 36121ah)
  if (m) return 'HLM-XNW36V' + m[1] + 'AH' + m[2] + m[3];
  return s;
}
// Dubbel-controle: bij LN-nummers zijn de 7 cijfers achteraan uniek; een verlezen letter (bijv. Q als G) mag een dubbel niet verbergen.
const dupKey = s => { const m = String(s).match(/^LNA22G29[A-Z0-9]{4}(\d{6,8})$/); return m ? 'LN' + m[1] : String(s); };
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : null; };
const key = n => String(Math.round(n * 100) / 100);
const fmt = n => String(n).replace('.', ',');
const status = t => $('status').textContent = t;

function chips(el, items, onPick) {
  el.innerHTML = '';
  items.forEach(t => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = t; b.onclick = () => onPick(t); el.appendChild(b); });
}

/* ---------- foto verwerken ---------- */
$('preview').onclick = () => { const p = $('preview'); p.style.maxHeight = p.style.maxHeight === 'none' ? '200px' : 'none'; };
$('snap').onclick = () => { $('file').value = ''; $('file').click(); };
$('file').onchange = e => { const f = e.target.files[0]; if (f) processFile(f); };

async function processFile(f) {
  const url = URL.createObjectURL(f);
  $('preview').src = url; $('preview').style.display = 'block';
  $('snap').disabled = true;
  try {
    const img = await loadImage(url);
    const canvas = toCanvas(img, 1800);
    // Google Drive laat de foto lezen via je eigen script (gratis, veel nauwkeuriger). Lukt dat, dan is dat het antwoord:
    // geen trage lokale terugval meer. Alleen zonder Sheet-link (geen Google) wordt de trage lokale herkenning gebruikt.
    let lines = [], codes = [], note = '';
    $('raw').textContent = '';
    if (hook) {
      status('Foto laten lezen door Google… (duurt ongeveer 5-10 seconden)');
      try {
        lines = await driveOcr(canvas);
        $('raw').textContent = lines.length ? 'Google las: ' + lines.map(l => l.text.trim()).join('  |  ').slice(0, 500) : 'Google las geen tekst op deze foto. Probeer een scherpere foto, dichterbij en recht op de tekst.';
      } catch (err) { note = ' (Google-lezen mislukt: ' + err.message + ' — vul handmatig in)'; }
    } else {
      note = ' (stel de Sheet-link in bij Instellingen voor veel betere herkenning)';
      status('Lokaal lezen… (traag)');
      codes = await readBarcodes(canvas);
      lines = await readText(canvas);
    }
    handleResults(codes, lines, note);
  } catch (err) {
    status('Lezen mislukt: ' + err.message + ' — vul handmatig in.');
  }
  $('snap').disabled = false;
}

function loadImage(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('afbeelding')); i.src = url; }); }
function toCanvas(img, max) {
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const rot = (c, deg) => {
  if (!deg) return c;
  const r = document.createElement('canvas'), sw = deg === 180;
  r.width = sw ? c.width : c.height; r.height = sw ? c.height : c.width;
  const x = r.getContext('2d'); x.translate(r.width / 2, r.height / 2); x.rotate(deg * Math.PI / 180);
  x.drawImage(c, -c.width / 2, -c.height / 2); return r;
};

async function readBarcodes(canvas) {
  const found = new Set();
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector().detect(canvas); r.forEach(b => b.rawValue && found.add(b.rawValue)); } catch {}
  }
  if (!found.size && window.ZXing) {
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const rd = new ZXing.MultiFormatReader(); rd.setHints(hints);
    // Een scheef gehouden telefoon geeft een barcode die een paar graden gedraaid staat; ZXing vindt die dan
    // vaak niet. Daarom meerdere kleine hoeken proberen (en dezelfde hoeken ook liggend/staand).
    const angles = [0, -2, 2, -4, 4, -6, 6, -9, 9, -12, 12];
    outer: for (const base of [0, 90]) {
      for (const a of angles) {
        const c = rotAny(canvas, base + a);
        await new Promise(r => setTimeout(r, 0));          // houd de pagina responsief
        try {
          const bm = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
          found.add(rd.decode(bm).getText()); break outer;
        } catch {}
      }
    }
  }
  return [...found];
}
/* Draait een canvas om een willekeurige hoek; het canvas groeit mee en de rand wordt wit gevuld. */
function rotAny(c, deg) {
  if (!deg) return c;
  const t = deg * Math.PI / 180, cs = Math.abs(Math.cos(t)), sn = Math.abs(Math.sin(t));
  const r = document.createElement('canvas');
  r.width = Math.ceil(c.width * cs + c.height * sn); r.height = Math.ceil(c.width * sn + c.height * cs);
  const x = r.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, r.width, r.height);
  x.translate(r.width / 2, r.height / 2); x.rotate(t); x.drawImage(c, -c.width / 2, -c.height / 2);
  return r;
}

/* Zoekt rijen losse tekens (gegraveerde of gedrukte tekst) en negeert krassen/structuur.
   bright=true: tekst lichter dan achtergrond (gravering op zwart); false: donkere tekst op licht label.
   Geeft per gevonden tekstregel een schoon zwart-op-wit canvas terug. */
function findTextLines(c, bright) {
  const w = c.width, h = c.height, max = Math.max(w, h);
  const g = document.createElement('canvas'); g.width = w; g.height = h;
  const gx = g.getContext('2d'); gx.filter = 'grayscale(1)'; gx.drawImage(c, 0, 0);
  const bl = document.createElement('canvas'); bl.width = w; bl.height = h;
  const bx = bl.getContext('2d'); bx.filter = 'grayscale(1) blur(' + Math.round(max / 70) + 'px)'; bx.drawImage(c, 0, 0);
  const a = gx.getImageData(0, 0, w, h).data, b = bx.getImageData(0, 0, w, h).data;
  const bin = new Uint8Array(w * h);
  for (let i = 0; i < bin.length; i++) { const d = a[i * 4] - b[i * 4]; bin[i] = (bright ? d > 22 : d < -22) ? 1 : 0; }

  const lab = new Uint8Array(w * h), stack = new Int32Array(w * h), comps = [];
  const lo = max * 0.008, hi = max * 0.12;
  for (let s = 0; s < bin.length; s++) {
    if (!bin[s] || lab[s]) continue;
    let sp = 0, n = 0, x0 = w, x1 = 0, y0 = h, y1 = 0; const px = [];
    stack[sp++] = s; lab[s] = 1;
    while (sp) {
      const p = stack[--sp]; px.push(p); n++; const x = p % w, y = (p / w) | 0;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const q = ny * w + nx; if (bin[q] && !lab[q]) { lab[q] = 1; stack[sp++] = q; }
      }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, size = Math.max(bw, bh), fill = n / (bw * bh);
    if (size > hi || size < 4) continue;
    const isLetter = size >= lo && fill > 0.12 && Math.min(bw, bh) >= 3;
    const isBar = !isLetter && fill > 0.6 && Math.max(bw, bh) / Math.min(bw, bh) >= 2 && size >= lo * 0.4;
    if (isLetter || isBar) comps.push({ px, x0, x1, y0, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, size, bar: isBar });
  }
  // letters die in een rij staan (horizontaal of verticaal) horen bij elkaar
  const L = comps.filter(k => !k.bar), par = L.map((_, i) => i), nbc = L.map(() => 0);
  const find = i => par[i] === i ? i : (par[i] = find(par[i]));
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const k = L[i], o = L[j], r = o.size / k.size, dx = Math.abs(o.cx - k.cx), dy = Math.abs(o.cy - k.cy);
    if (r < 0.55 || r > 1.8 || Math.hypot(dx, dy) > 2.6 * k.size) continue;
    if ((dy < 0.6 * k.size && dx > 0.3 * k.size) || (dx < 0.6 * k.size && dy > 0.3 * k.size)) { nbc[i]++; nbc[j]++; par[find(i)] = find(j); }
  }
  const groups = new Map();
  L.forEach((k, i) => { if (nbc[i] >= 1) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(k); } });
  const out = [];
  for (const mem of groups.values()) {
    if (mem.length < 6) continue;
    const sizes = mem.map(k => k.size).sort((p, q) => p - q), med = sizes[sizes.length >> 1];
    let x0 = Math.min(...mem.map(k => k.x0)), x1 = Math.max(...mem.map(k => k.x1)), y0 = Math.min(...mem.map(k => k.y0)), y1 = Math.max(...mem.map(k => k.y1));
    const vertical = (y1 - y0) > (x1 - x0);
    const all = mem.slice();
    const mcx = mem.reduce((s, k) => s + k.cx, 0) / mem.length, mcy = mem.reduce((s, k) => s + k.cy, 0) / mem.length;
    for (const k of comps) {                      // streepjes (koppelteken) die op dezelfde regel liggen
      if (!k.bar || k.size < 0.3 * med || k.cx < x0 - med || k.cx > x1 + med || k.cy < y0 - med || k.cy > y1 + med) continue;
      if (vertical ? Math.abs(k.cx - mcx) < 0.4 * med : Math.abs(k.cy - mcy) < 0.4 * med) all.push(k);
    }
    for (const k of all) { x0 = Math.min(x0, k.x0); x1 = Math.max(x1, k.x1); y0 = Math.min(y0, k.y0); y1 = Math.max(y1, k.y1); }
    const sc = Math.max(0.6, Math.min(3, 70 / med)), m = Math.round(med * 0.7);
    const cw = x1 - x0 + 1 + 2 * m, ch = y1 - y0 + 1 + 2 * m;
    const small = document.createElement('canvas'); small.width = cw; small.height = ch;
    const sx = small.getContext('2d'), id = sx.createImageData(cw, ch); id.data.fill(255);
    for (const k of all) for (const p of k.px) { const i = ((((p / w) | 0) - y0 + m) * cw + (p % w - x0 + m)) * 4; id.data[i] = id.data[i + 1] = id.data[i + 2] = 0; }
    sx.putImageData(id, 0, 0);
    const big = document.createElement('canvas'); big.width = Math.round(cw * sc); big.height = Math.round(ch * sc);
    const bgx = big.getContext('2d'); bgx.fillStyle = '#fff'; bgx.fillRect(0, 0, big.width, big.height); bgx.drawImage(small, 0, 0, big.width, big.height);
    out.push({ canvas: big, vertical, n: mem.length });
  }
  return out.sort((p, q) => q.n - p.n).slice(0, 4);
}
const AHRE = /\d+V\d+(?:[.,]\d+)?AH/;
const squash = s => s.toUpperCase().replace(/\s+/g, '');

async function readText(canvas) {
  if (!window.Tesseract) throw new Error('OCR niet geladen (internet nodig)');
  if (!worker) {
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({ tessedit_pageseg_mode: '7', tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./:' });
  }
  const all = [];
  for (const bright of [true, false]) {           // lichte gravering op donker, of donkere print op licht
    status('Tekstregels zoeken…');
    await new Promise(r => setTimeout(r, 30));
    for (const ln of findTextLines(canvas, bright)) {
      let best = null;
      for (const deg of (ln.vertical ? [90, 270] : [0, 180])) {   // staat de tekst op zijn kop? probeer beide
        const { data } = await worker.recognize(rot(ln.canvas, deg));
        if (!best || data.confidence > best.conf) best = { text: data.text, conf: data.confidence };
      }
      all.push(best);
    }
  }
  return all;
}

/* Foto naar het Apps Script sturen; dat laat Google Drive de tekst lezen (OCR) en geeft de regels terug. */
async function driveOcr(canvas) {
  const sc = Math.min(1, 1400 / Math.max(canvas.width, canvas.height));      // kleiner = sneller versturen op mobiel
  const small = document.createElement('canvas'); small.width = Math.round(canvas.width * sc); small.height = Math.round(canvas.height * sc);
  small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
  const image = small.toDataURL('image/jpeg', 0.75).split(',')[1];
  let lastErr;
  for (let poging = 1; poging <= 2; poging++) {                               // Google is soms traag of faalt; één keer opnieuw proberen
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
    try {
      if (poging === 2) status('Opnieuw proberen…');
      const r = await fetch(hook, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'ocr', image }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'onbekende fout');
      return (j.text || '').split(/\r?\n/).filter(t => t.trim()).map(text => ({ text, conf: 90 }));
    } catch (e) { lastErr = new Error(e.name === 'AbortError' ? 'te lang gewacht' : e.message); }
    finally { clearTimeout(timer); }
  }
  throw lastErr;
}

// Bekende serienummerpatronen (ook midden in een regel met andere tekst, en met kleine leesfouten)
const SERIAL_RES = [
  /LN-?\d+V\d+(?:[.,]\d+)?AH-?[G0]29-?[A-Z0-9]{2}-?[A-Z0-9]{2}-?[0-9O]{6,8}/,   // LN gegraveerd
  /(?:LN|N)?A22[G0]29[A-Z0-9]{4}[0-9O]{6,8}/,                                    // LN sticker
  /HLM-?[A-Z0-9]{3,14}AH\d{8}\d{3}/,                                             // HLM gegraveerd
  /TY\d{14,20}/                                                                  // TY gegraveerd (TY + cijfers)
];
function extractSerials(lines) {
  const found = [];
  for (const l of lines) {
    const t = squash(l.text);
    for (const re of SERIAL_RES) { const m = t.match(re); if (m) found.push(canonSerial(m[0])); }
  }
  return [...new Set(found)];
}

function handleResults(codes, lines, note) {
  const known = extractSerials(lines);
  const scored = [];
  codes.forEach(c => scored.push([200, normSerial(c)]));
  if (!known.length) lines.forEach(l => {          // onbekend patroon: bied elke regel en elk woord met cijfers aan als voorstel
    const words = l.text.trim().split(/\s+/), alleenCijferwoorden = words.every(w => /\d/.test(w));
    for (let c of [...(alleenCijferwoorden ? [l.text] : []), ...words]) {      // hele regel alleen als elk woord cijfers heeft (bijv. "…20250209 238")
      c = c.replace(/^\s*(S\/?N|SER(?:IAL)?\.?(?:\s*NO\.?)?)\s*[:.#-]?\s*/i, '');
      const t = squash(c).replace(/[^A-Z0-9\-\/.]/g, '').replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g, '');
      if (l.conf < (AHRE.test(t) ? 25 : 45) || t.length < 6 || !/\d/.test(t)) continue;
      scored.push([l.conf + Math.min(t.length, 25) + (AHRE.test(t) ? 100 : 0), t]);
    }
  });
  scored.sort((a, b) => b[0] - a[0]);
  const uniq = known.length ? known.slice(0, 4) : [...new Set(scored.map(s => s[1]))].slice(0, 8);
  if (uniq[0] && !$('serial').value) setSerial(uniq[0]);
  chips($('serialChips'), uniq.map(canonSerial).filter((t, i, a) => a.indexOf(t) === i), setSerial);

  const txt = lines.filter(l => l.conf >= 20).map(l => squash(l.text)).join(' ');
  const ahs = [];
  for (const s of known) { const h = s.match(/^HLM.*?(\d{2})AH\d{8}/); if (h) ahs.push(key(+h[1])); }   // HLM: Ah staat in het nummer
  for (const m of txt.matchAll(/V(\d+(?:[.,]\d+)?)AH/g)) ahs.push(key(num(m[1])));
  for (const m of txt.matchAll(/(\d{3,6})MAH/g)) ahs.push(key(+m[1] / 1000));
  for (const m of txt.matchAll(/(?<![\dV.,])(\d{1,3}(?:[.,]\d{1,2})?)AH/g)) ahs.push(key(num(m[1])));
  const v = txt.match(/(\d{2})V/), wh = txt.match(/(\d{3,4}(?:[.,]\d)?)WH/);
  if (v && wh) {                                  // Wh / V = Ah: controle op een verlezen komma (16,8 gelezen als 168)
    const calc = num(wh[1]) / +v[1];
    if (!ahs.length || Math.abs(+ahs[0] - calc) / calc > 0.05) ahs.unshift(key(calc));
    else ahs.push(key(calc));
  }
  const ahU = [...new Set(ahs)].filter(x => +x > 0 && +x <= 100);
  if (ahU.length && !$('ah').value) { $('ah').value = fmt(ahU[0]); updateWeight(); }
  chips($('ahChips'), ahU.map(fmt), t => { $('ah').value = t; updateWeight(); });

  status((uniq.length ? 'Controleer en corrigeer indien nodig. Tik een voorstel om te kiezen.' : 'Niets herkend — vul handmatig in.') + (note || ''));
}

/* ---------- velden ---------- */
function checkDup() {
  const s = canonSerial($('serial').value);
  const same = s && records.find(r => dupKey(r.serial) === dupKey(s));
  $('dupWarn').textContent = !same ? '' : (same.serial === s ? 'ℹ Dit serienummer is al geregistreerd; het wordt als DUBBEL genoteerd.'
    : 'ℹ Lijkt op al geregistreerd nummer ' + same.serial + ' (zelfde cijfers); het wordt als DUBBEL genoteerd.');
}
function updateWeight() {
  const a = num($('ah').value);
  if (a === null) { $('kgAsk').classList.add('hide'); return; }
  const w = weights[key(a)];
  if (w !== undefined) { $('kg').value = fmt(w); $('kgAsk').classList.add('hide'); }
  else { $('kg').value = ''; $('kgAsk').classList.remove('hide'); }
}
// Staat de Ah in het serienummer (bijv. HLM-XNW36v21ah2025... of LN-36V16.8AH-G29...), dan vullen we die automatisch in.
function deriveAh(raw) {
  const m = squash(raw).match(/V(\d+(?:[.,]\d+)?)AH/);
  if (m && !ahTyped) { $('ah').value = fmt(key(num(m[1]))); updateWeight(); }
}
function setSerial(raw) { deriveAh(raw); $('serial').value = canonSerial(raw); checkDup(); applySupplier(); }
$('serial').oninput = () => { checkDup(); deriveAh($('serial').value); };
$('serial').onchange = () => setSerial($('serial').value);   // bij verlaten van het veld omzetten naar stickervorm
let ahTyped = false;
$('ah').oninput = () => { ahTyped = true; updateWeight(); };

$('reset').onclick = clearForm;
function clearForm() {
  ['serial', 'ah', 'kg'].forEach(i => $(i).value = ''); ahTyped = false;
  $('sup').value = ''; $('typ').value = ''; autoSup = false; autoTyp = false; applyType();
  $('serialChips').innerHTML = ''; $('ahChips').innerHTML = '';
  $('dupWarn').textContent = ''; $('kgAsk').classList.add('hide');
  $('preview').style.display = 'none'; status('');
}

$('save').onclick = async () => {
  const serial = canonSerial($('serial').value), ah = num($('ah').value), kg = num($('kg').value);
  if (!serial) return alert('Serienummer ontbreekt.');
  if (ah === null) return alert('Ah ontbreekt.');
  if (kg === null) return alert('Gewicht ontbreekt — vul het gewicht in.');
  const sup = $('sup').value, typ = $('typ').value;
  if (!sup || !typ) return alert('Kies leverancier en type.');
  weights[key(ah)] = kg; store.set('weights', weights);
  const ts = Date.now();
  records.push({ id: ts + '-' + Math.random().toString(36).slice(2, 6), serial, kg, ah, sup, typ, ts, dup: records.some(r => dupKey(r.serial) === dupKey(serial)), synced: false });
  store.set('records', records);
  clearForm(); render(); loadSettings();
  await sync();
};

/* ---------- sync naar Google Sheets ---------- */
// Apps Script web-app: no-cors + text/plain voorkomt preflight. Het script negeert dubbel verstuurde id's.
const post = body => fetch(hook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
const dateStr = ts => { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
async function sync() {
  if (!hook) return;
  try {
    while (pendingDel.length) { await post({ action: 'delete', id: pendingDel[0] }); pendingDel.shift(); store.set('pendingDel', pendingDel); }
    for (const r of records) {
      if (r.synced) continue;
      await post({ action: 'add', id: r.id, serial: r.serial, kg: r.kg, ah: r.ah, sup: r.sup, typ: r.typ, date: dateStr(r.ts) });
      r.synced = true; store.set('records', records); render();
    }
  } catch {} // offline: later opnieuw
}
$('retry').onclick = sync;
window.addEventListener('online', sync);

/* ---------- lijst / export ---------- */
function render() {
  $('count').textContent = records.length + ' stuks'; $('n2').textContent = records.length;
  const tb = $('tbl').tBodies[0]; tb.innerHTML = '';
  records.slice().reverse().forEach(r => {
    const tr = tb.insertRow();
    tr.insertCell().textContent = r.serial + (r.dup ? ' (DUBBEL)' : '') + ' · ' + (r.sup || '?') + ' / ' + (r.typ || '?');
    tr.insertCell().textContent = fmt(r.kg);
    tr.insertCell().textContent = fmt(r.ah);
    const s = tr.insertCell(); s.textContent = hook ? (r.synced ? '✓' : '…') : ''; s.className = r.synced ? 'sync-ok' : 'sync-wait';
    const d = tr.insertCell(); const b = document.createElement('button'); b.className = 'small sec'; b.textContent = '✕';
    b.onclick = () => {
      if (!confirm('Verwijderen' + (r.synced ? ' (ook uit de Google Sheet)' : '') + '?\n' + r.serial)) return;
      records.splice(records.indexOf(r), 1); store.set('records', records);
      if (r.synced && hook) { pendingDel.push(r.id); store.set('pendingDel', pendingDel); sync(); }
      render();
    };
    d.appendChild(b);
  });
}
$('csv').onclick = () => {
  const rows = [['Serienummer', 'Gewicht (kg)', 'AH', 'Leverancier', 'Type', 'Datum', 'Dubbel'], ...records.map(r => [r.serial, r.kg, r.ah, r.sup || '', r.typ || '', dateStr(r.ts), r.dup ? 'DUBBEL' : ''])];
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'accu-registratie.csv'; a.click();
};

/* ---------- instellingen ---------- */
function loadSettings() {
  $('hook').value = hook;
  $('wt').value = Object.entries(weights).map(([k, v]) => k + '=' + v).join('\n');
}
$('saveSet').onclick = () => {
  hook = $('hook').value.trim(); store.set('hook', hook);
  const w = {};
  $('wt').value.split('\n').forEach(l => { const [a, b] = l.split('='); const A = num(a || ''), B = num(b || ''); if (A !== null && B !== null) w[key(A)] = B; });
  weights = w; store.set('weights', weights);
  render(); sync(); alert('Opgeslagen.');
};

// leverancier: alleen automatisch bij bekende voorvoegsels (HLM = Rightenergy; LNA, TY of S = VDM); anders blijft het leeg en kiest de gebruiker zelf
let autoSup = false;
function supplierFor(serial) {
  const s = canonSerial(serial);
  if (/^HLM/.test(s)) return 'Rightenergy';
  if (/^(LNA|TY|S)/.test(s)) return 'VDM';
  return '';
}
// type: TY, S en LNA = Saber; HLM = HLM; anders leeg (zelf kiezen). In VDM-modus is het type altijd VDM.
let autoTyp = false;
function typeFor(serial) {
  const s = canonSerial(serial);
  if (/^HLM/.test(s)) return 'HLM';
  if (/^(LNA|TY|S)/.test(s)) return 'Saber';
  return '';
}
function applyType() {
  const vb = $('vdmBtn');                          // knop toont de stand: blauw = aan, omlijnd = uit
  vb.textContent = vdmMode ? 'VDM-modus staat AAN (alle registraties = Type VDM) — tik om uit te zetten' : 'VDM-modus staat uit — tik om aan te zetten';
  vb.className = vdmMode ? '' : 'sec';
  if (vdmMode) { $('typ').value = 'VDM'; $('typ').disabled = true; return; }
  $('typ').disabled = false;
  const v = typeFor($('serial').value);
  if (v) { $('typ').value = v; autoTyp = true; }
  else if (autoTyp) { $('typ').value = ''; autoTyp = false; }
}
function applySupplier() {
  const v = supplierFor($('serial').value);
  if (v) { $('sup').value = v; autoSup = true; }
  else if (autoSup) { $('sup').value = ''; autoSup = false; }
  applyType();
}
$('sup').onchange = () => { autoSup = false; };
$('typ').onchange = () => { autoTyp = false; };
$('vdmBtn').onclick = () => { vdmMode = !vdmMode; store.set('vdmMode', vdmMode); if (!vdmMode) $('typ').value = ''; autoTyp = false; applyType(); };
// Nieuwe versie melden: de telefoon bewaart de pagina soms; vergelijk met wat online staat.
$('upd').onclick = () => { location.href = location.pathname + '?v=' + Date.now(); };
(async () => {
  try {
    const r = await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/id="ver"[^>]*>([^<]*)</);
    if (m && m[1].trim() !== $('ver').textContent.trim()) $('upd').classList.remove('hide');
  } catch {}
})();
$('serial').addEventListener('input', applySupplier);
$('serial').addEventListener('change', applySupplier);
applyType();
loadSettings(); render(); sync();
</script>
</body>
</html>
